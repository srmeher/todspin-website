<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 1200" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Soft Drop Shadow Filter -->
    <filter id="glassShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" />
      <feOffset dx="0" dy="24" />
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Main Glass Body Cylindrical Gradient -->
    <linearGradient id="glassBodyGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1303" stop-opacity="0.98"/>
      <stop offset="12%" stop-color="#323c14" stop-opacity="0.88"/>
      <stop offset="28%" stop-color="#9eb448" stop-opacity="0.51"/>
      <stop offset="52%" stop-color="#4d591b" stop-opacity="0.45"/>
      <stop offset="82%" stop-color="#323c14" stop-opacity="0.85"/>
      <stop offset="98%" stop-color="#252d0e" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0d1303" stop-opacity="0.98"/>
    </linearGradient>

    <!-- High Gloss Specular Reflection Streak -->
    <linearGradient id="specularStreak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.7224999999999999"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Liquid Gradient -->
    <linearGradient id="liquidGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="transparent" stop-opacity="0"/>
      <stop offset="70%" stop-color="transparent" stop-opacity="0"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </linearGradient>

    <!-- Cut Foil Metallic Gradient -->
    <linearGradient id="foilGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a6d1c"/>
      <stop offset="35%" stop-color="#f9e79f"/>
      <stop offset="70%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6d1c"/>
    </linearGradient>

    <!-- Open Lip Hollow Cavity Depth Gradient -->
    <radialGradient id="openLipDepth" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#020405" stop-opacity="0.98"/>
      <stop offset="70%" stop-color="#0d1303" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#323c14" stop-opacity="0.85"/>
    </radialGradient>

    <!-- Gold Foil Label Border -->
    <linearGradient id="labelGoldBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#fff2b2"/>
      <stop offset="100%" stop-color="#aa820a"/>
    </linearGradient>
  </defs>

  <!-- ================= BOTTLE STRUCTURE ================= -->
  <!-- Outline modeled exactly after Burgundy / Champagne curved glass bottle -->
  <g id="bottleGlassHull">
    <!-- Main Glass Body & Sloping Shoulder Geometry -->
    <path d="
      M 130,1080
      L 130,520
      C 130,410 206,310 216,180
      L 216,145
      C 204,142 200,132 210,125
      C 198,118 198,102 210,96
      C 210,88 222,80 250,80
      C 278,80 290,88 290,96
      C 302,102 302,118 290,125
      C 300,132 296,142 284,145
      L 284,180
      C 294,310 370,410 370,520
      L 370,1080
      C 370,1105 310,1118 250,1118
      C 190,1118 130,1105 130,1080 Z
    " fill="url(#glassBodyGrad)" stroke="#0d1303" stroke-width="3" />

    <!-- Visible Inner Concave Base (Punt Indent) -->
    <path d="
      M 135,1082
      C 180,1040 320,1040 365,1082
      C 320,1108 180,1108 135,1082 Z
    " fill="#171e06" opacity="0.75" />

    <!-- Glass Wall Inner Thickness Contour -->
    <path d="
      M 140,1075
      L 140,522
      C 140,415 212,316 222,182
      L 222,148
      L 278,148
      L 278,182
      C 288,316 360,415 360,522
      L 360,1075
    " fill="none" stroke="#9eb448" stroke-width="2" opacity="0.3825" />

    <!-- OPEN LIP & CROWN FINISH DETAILS (NO CAP) -->
    <!-- Inner Dark Hollow Hole Cavity -->
    <ellipse cx="250" cy="85" rx="32" ry="7" fill="url(#openLipDepth)" />
    
    <!-- Upper Ring Lip Collar Outer Edge -->
    <ellipse cx="250" cy="83" rx="38" ry="8" fill="none" stroke="#c6dc6f" stroke-width="2" opacity="0.9" />
    
    <!-- Secondary Lower Lip Crown Bead Ring -->
    <ellipse cx="250" cy="110" rx="42" ry="7" fill="none" stroke="#738628" stroke-width="2.5" opacity="0.75" />
    
    <!-- Mouth Gloss Curve Highlight -->
    <path d="M 218,83 A 32 6 0 0 0 282,83" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.7224999999999999" />
  </g>

  <!-- CUT FOIL CAP SLEEVE (Trimmed below crown bead) -->
  <g id="cutFoilSleeve">
    <path d="
      M 215,145
      L 285,145
      C 292,150 294,158 286,162
      L 284,210
      L 216,210
      L 214,162
      C 206,158 208,150 215,145 Z
    " fill="url(#foilGrad)" stroke="#8a6d1c" stroke-width="1" />
    
    <!-- Cut Metallic Edge Ring -->
    <ellipse cx="250" cy="145" rx="35" ry="5" fill="#f9e79f" opacity="0.9" />
    <line x1="216" y1="210" x2="284" y2="210" stroke="#f9e79f" stroke-width="1.5" opacity="0.7" />
  </g>

  <!-- UP-FACING PAPER LABEL (Positioned on top side of main body) -->
  <g id="upFacingPaperLabel" transform="translate(135, 520)">
    <!-- Label Drop Shadow -->
    <rect x="2" y="2" width="230" height="300" rx="6" fill="#000000" opacity="0.38" filter="url(#glassShadow)" />
    
    <!-- Textured Paper Base -->
    <rect x="0" y="0" width="230" height="300" rx="5" fill="#fcf8f0" stroke="url(#labelGoldBorder)" stroke-width="3.5" />
    
    <!-- Elegant Dual Border Lines -->
    <rect x="8" y="8" width="214" height="284" rx="3" fill="none" stroke="#2a201a" stroke-width="0.9" opacity="0.7" />
    <rect x="12" y="12" width="206" height="276" rx="2" fill="none" stroke="#b89737" stroke-width="0.6" />

    <!-- Vintage Heraldic Emblem -->
    <g transform="translate(115, 58) scale(1.0)" fill="#b89737">
      <path d="M 0,-20 L 14,-7 L 9,12 L -9,12 L -14,-7 Z" fill="none" stroke="#b89737" stroke-width="1.8"/>
      <circle cx="0" cy="-4" r="3.5" />
      <path d="M -18,16 C -9,11 9,11 18,16" fill="none" stroke="#b89737" stroke-width="1.4"/>
    </g>

    <!-- Customizable Label Typography (Facing UP) -->
    <text x="115" y="118" font-family="'Cinzel', 'Times New Roman', serif" font-size="15" font-weight="800" fill="#17120e" text-anchor="middle" letter-spacing="1.5">TRUTH OR DARE SPIN</text>
    <text x="115" y="142" font-family="'Playfair Display', serif" font-size="10" font-style="italic" fill="#5c4735" text-anchor="middle" letter-spacing="0.8">PARTY EDITION</text>
    
    <line x1="55" y1="168" x2="175" y2="168" stroke="#b89737" stroke-width="0.9" />
    
    <text x="115" y="200" font-family="'Cinzel', serif" font-size="16" font-weight="700" fill="#17120e" text-anchor="middle" letter-spacing="2.5">2026</text>
    
    <text x="115" y="252" font-family="'Outfit', sans-serif" font-size="7.5" font-weight="600" fill="#7a624d" text-anchor="middle" letter-spacing="1">AUTHENTIC GLASS BOTTLE</text>
    <text x="115" y="266" font-family="'Outfit', sans-serif" font-size="7" fill="#8c725c" text-anchor="middle" letter-spacing="0.8">750 ML • SPIN THE BOTTLE</text>
  </g>

  <!-- HIGH GLOSS SPECULAR REFLECTIONS (Realistic Glass Finish) -->
  <g id="glassSpecularHighlights" pointer-events="none">
    <!-- Left Long Curved Highlight Streak -->
    <path d="
      M 148,1070
      L 148,520
      C 148,415 218,318 227,185
      L 227,150
    " fill="none" stroke="url(#specularStreak)" stroke-width="9" stroke-linecap="round" opacity="0.7224999999999999" />

    <!-- Sharp Bright White Core Line -->
    <path d="
      M 154,1060
      L 154,520
      C 154,420 222,322 231,185
      L 231,150
    " fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.5525" />

    <!-- Right Subtle Rim Light Glint -->
    <path d="
      M 352,1060
      L 352,520
      C 352,420 284,322 275,185
      L 275,150
    " fill="none" stroke="#9eb448" stroke-width="3" stroke-linecap="round" opacity="0.2975" />
  </g>
</svg>