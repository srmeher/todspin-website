<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" fill="none">
  <defs>
    <!-- Dynamic glow filter using currentColor -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Panel -->
  <rect x="4" y="4" width="232" height="132" rx="12" fill="#1e1238" fill-opacity="0.6" stroke="currentColor" stroke-width="4" />

  <!-- Inner decorative line (gaming vibe) -->
  <rect x="10" y="10" width="220" height="120" rx="8" stroke="currentColor" stroke-width="1.5" opacity="0.3" />

  <!-- Top Text -->
  <text x="120" y="52" font-family="'Arial Black', 'Impact', sans-serif" font-size="24" font-weight="900" fill="currentColor" text-anchor="middle" letter-spacing="1" opacity="0.85">
    Get Set Go
  </text>

  <!-- Bottom Text with Glow -->
  <text x="120" y="110" font-family="'Arial Black', 'Impact', sans-serif" font-size="56" font-weight="900" fill="currentColor" text-anchor="middle" letter-spacing="2" filter="url(#glow)">
    Play
  </text>
</svg>