<svg xmlns="http://www.w3.org/2000/svg" viewBox="124 74 252 1052" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Main Glass Body Cylindrical Gradient -->
    <linearGradient id="glassBodyGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1303" stop-opacity="0.98" />
      <stop offset="12%" stop-color="#323c14" stop-opacity="0.88" />
      <stop offset="28%" stop-color="#9eb448" stop-opacity="0.51" />
      <stop offset="52%" stop-color="#4d591b" stop-opacity="0.45" />
      <stop offset="82%" stop-color="#323c14" stop-opacity="0.85" />
      <stop offset="98%" stop-color="#252d0e" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0d1303" stop-opacity="0.98" />
    </linearGradient>

    <!-- High Gloss Specular Reflection Streak -->
    <linearGradient id="specularStreak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.72" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Cut Foil Metallic Gradient -->
    <linearGradient id="foilGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a6d1c" />
      <stop offset="35%" stop-color="#f9e79f" />
      <stop offset="70%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#8a6d1c" />
    </linearGradient>

    <!-- Open Lip Hollow Cavity Depth Gradient -->
    <radialGradient id="openLipDepth" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#020405" stop-opacity="0.98" />
      <stop offset="70%" stop-color="#0d1303" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#323c14" stop-opacity="0.85" />
    </radialGradient>

    <!-- Gold Foil Label Border -->
    <linearGradient id="labelGoldBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#fff2b2" />
      <stop offset="100%" stop-color="#aa820a" />
    </linearGradient>
  </defs>

  <!-- ================= BOTTLE STRUCTURE ================= -->
  <g id="bottleGlassHull">
    <!-- Main Glass Body & Sloping Shoulder Geometry -->
    <path d="
      M 130,1080
      L 130,520
      C 130,410 206,310 216,180
      L 216,145
      C 204,142 200,132 210,125
      C 198,118 198,102 210,96
      C 210,88 222,80 250,80
      C 278,80 290,88 290,96
      C 302,102 302,118 290,125
      C 300,132 296,142 284,145
      L 284,180
      C 294,310 370,410 370,520
      L 370,1080
      C 370,1105 310,1118 250,1118
      C 190,1118 130,1105 130,1080 Z
    " fill="url(#glassBodyGrad)" stroke="#0d1303" stroke-width="3" />

    <!-- Visible Inner Concave Base (Punt Indent) -->
    <path d="
      M 135,1082
      C 180,1040 320,1040 365,1082
      C 320,1108 180,1108 135,1082 Z
    " fill="#171e06" opacity="0.75" />

    <!-- OPEN LIP & CROWN FINISH DETAILS -->
    <ellipse cx="250" cy="85" rx="32" ry="7" fill="url(#openLipDepth)" />
    <ellipse cx="250" cy="83" rx="38" ry="8" fill="none" stroke="#c6dc6f" stroke-width="2" opacity="0.9" />
    <ellipse cx="250" cy="110" rx="42" ry="7" fill="none" stroke="#738628" stroke-width="2.5" opacity="0.75" />
    <path d="M 218,83 A 32 6 0 0 0 282,83" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.72" />
  </g>

  <!-- CUT FOIL CAP SLEEVE -->
  <g id="cutFoilSleeve">
    <path d="
      M 215,145
      L 285,145
      C 292,150 294,158 286,162
      L 284,208
      L 216,208
      L 214,162
      C 206,158 208,150 215,145 Z
    " fill="url(#foilGrad)" stroke="#8a6d1c" stroke-width="1" />
    
    <!-- Cut Metallic Edge Ring -->
    <ellipse cx="250" cy="145" rx="35" ry="5" fill="#f9e79f" opacity="0.9" />
  </g>

  <!-- UP-FACING PAPER LABEL WITH HIGH-CONTRAST BOLD GAME TYPOGRAPHY -->
  <g id="upFacingPaperLabel" transform="translate(135, 515)">
    <!-- 60 FPS GPU-Accelerated Vector Shadows (No CPU Filter Rasterization) -->
    <rect x="0" y="4" width="230" height="305" rx="6" fill="#000000" opacity="0.15" />
    <rect x="0" y="7" width="230" height="305" rx="6" fill="#000000" opacity="0.22" />
    
    <!-- Textured Paper Base -->
    <rect x="0" y="0" width="230" height="305" rx="5" fill="#fbf7ed" stroke="url(#labelGoldBorder)" stroke-width="3" />
    
    <!-- Clean Border Trim -->
    <rect x="6" y="6" width="218" height="293" rx="3" fill="none" stroke="#2b211b" stroke-width="1" opacity="0.5" />
    <rect x="9" y="9" width="212" height="287" rx="2" fill="none" stroke="#b89737" stroke-width="0.7" opacity="0.8" />

    <!-- Top Badge -->
    <text x="115" y="44" font-family="&#39;Cinzel&#39;, Georgia, &#39;Times New Roman&#39;, serif" font-size="11" font-weight="700" letter-spacing="3" fill="#6d543e" text-anchor="middle">PARTY EDITION</text>
    <line x1="38" y1="52" x2="192" y2="52" stroke="#b89737" stroke-width="0.9" opacity="0.75" />

    <!-- Large Punchy Title -->
    <text x="115" y="94" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="28" font-weight="bold" letter-spacing="2.5" fill="#181310" text-anchor="middle">TRUTH OR</text>
    <text x="115" y="145" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="46" font-weight="900" letter-spacing="4.5" fill="#8c1d2e" text-anchor="middle">DARE</text>

    <!-- Center Accent Line & Diamond -->
    <path d="M 32,162 H 96 M 134,162 H 198" stroke="#2b211b" stroke-width="1.2" opacity="0.8" />
    <polygon points="115,156 121,162 115,168 109,162" fill="#8c1d2e" />

    <!-- Subtitle & Motto -->
    <text x="115" y="190" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13.5" font-weight="800" letter-spacing="3.2" fill="#2d221c" text-anchor="middle">SPIN THE BOTTLE</text>
    <text x="115" y="212" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="11" font-style="italic" letter-spacing="1" fill="#6e5746" text-anchor="middle">TruthorDareSpin.com</text>

    <!-- Spinner Dial Emblem -->
    <g transform="translate(115, 245)">
      <circle r="12" fill="#f8f4ec" stroke="#2b211b" stroke-width="1.2" />
      <circle r="9.5" fill="none" stroke="#c4ac88" stroke-width="0.8" />
      <path d="M 0,-9 L 2.5,0 L 0,2 L -2.5,0 Z" fill="#8c1d2e" />
      <path d="M 0,9 L 2,0 L 0,-1 L -2,0 Z" fill="#2b2320" />
      <circle r="1.8" fill="#d4af37" />
    </g>

    <!-- Bottom Metadata -->
    <text x="115" y="278" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="8.5" font-weight="700" letter-spacing="1.8" fill="#544337" text-anchor="middle">ONLINE MULTIPLAYER • 2026</text>
    <text x="115" y="292" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="7" font-weight="600" letter-spacing="1.2" fill="#8c725c" text-anchor="middle">SPIN AT YOUR OWN RISK</text>
  </g>

  <!-- HIGH GLOSS SPECULAR REFLECTIONS -->
  <g id="glassSpecularHighlights" pointer-events="none">
    <path d="
      M 148,1070
      L 148,520
      C 148,415 218,318 227,185
      L 227,150
    " fill="none" stroke="url(#specularStreak)" stroke-width="9" stroke-linecap="round" opacity="0.72" />

    <path d="
      M 154,1060
      L 154,520
      C 154,420 222,322 231,185
      L 231,150
    " fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.55" />

    <path d="
      M 352,1060
      L 352,520
      C 352,420 284,322 275,185
      L 275,150
    " fill="none" stroke="#9eb448" stroke-width="3" stroke-linecap="round" opacity="0.3" />
  </g>
</svg>