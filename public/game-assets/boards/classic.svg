<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <radialGradient id="boardSurface" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="78%" stop-color="#f5f5f7"/>
      <stop offset="100%" stop-color="#e4e5e9"/>
    </radialGradient>

    <linearGradient id="outerRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#d9dbe1"/>
      <stop offset="100%" stop-color="#aeb2bc"/>
    </linearGradient>

    <filter id="boardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Soft shadow and outer rim -->
  <circle cx="300" cy="300" r="282" fill="url(#outerRim)" filter="url(#boardShadow)"/>

  <!-- Main board surface -->
  <circle cx="300" cy="300" r="267" fill="url(#boardSurface)" stroke="#b9bdc6" stroke-width="2"/>

  <!-- Inner decorative ring -->
  <circle cx="300" cy="300" r="247" stroke="#d8dae0" stroke-width="2"/>

  <!-- Four subtle guide marks -->
  <g stroke="#d4d6dc" stroke-width="2" stroke-linecap="round">
    <path d="M300 66v13"/>
    <path d="M534 300h-13"/>
    <path d="M300 534v-13"/>
    <path d="M66 300h13"/>
  </g>

  <!-- Center hub -->
  <circle cx="300" cy="300" r="13" fill="#eceef2" stroke="#c7cad2" stroke-width="2"/>
  <circle cx="300" cy="300" r="4" fill="#a8acb6"/>
</svg>